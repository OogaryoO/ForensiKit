name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Pester + PSScriptAnalyzer (Windows PowerShell 5.1)
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell   # Windows PowerShell 5.1，與目標環境一致（不是 pwsh）
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester 5 and PSScriptAnalyzer
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          $PSVersionTable.PSVersion.ToString()

      - name: PSScriptAnalyzer (src, gui)
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          $results = @(foreach ($p in @('src', 'gui') | Where-Object { Test-Path $_ }) {
              Invoke-ScriptAnalyzer -Path $p -Recurse -Severity Warning, Error
          })
          if ($results.Count -gt 0) {
            $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap | Out-String -Width 4096 | Write-Host
            throw "PSScriptAnalyzer found $($results.Count) issue(s)."
          }
          Write-Host 'PSScriptAnalyzer: no issues.'

      - name: Pester (tests/unit)
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 5.7.1
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests/unit'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputPath = 'testResults.xml'
          Invoke-Pester -Configuration $cfg

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: testResults.xml
          if-no-files-found: ignore
